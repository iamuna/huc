[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huc"
version = "0.1.0"
description = "Windows-first per-process hardware monitor and persistent executable blocklist"
requires-python = ">=3.11"
dependencies = ["psutil>=6.0,<8"]

[project.scripts]
huc = "huc.app:main"
huc-guard = "huc.guard:main"

[tool.setuptools.packages.find]
include = ["huc*"]
